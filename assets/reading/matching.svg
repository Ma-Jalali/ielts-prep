<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Manrope, system-ui, sans-serif">
  <title>A passage with every name circled</title>
  <rect width="640" height="300" rx="20" fill="#fff"/>
  <rect x="22" y="20" width="330" height="260" rx="14" fill="#fbfbfd" stroke="#dfe3ec"/>
  <g stroke="#d3d8e4" stroke-width="7" stroke-linecap="round">
    <path d="M46 52h282M46 74h250M46 96h120M226 96h102M46 118h260"/>
    <path d="M46 152h282M46 174h84M190 174h138M46 196h230"/>
    <path d="M46 230h282M46 252h150"/>
  </g>
  <g font-size="14" font-weight="800" fill="#18213f" text-anchor="middle"><text x="196" y="101">Japan</text><text x="160" y="179">Italy</text><text x="246" y="257">Japan</text></g>
  <g fill="none" stroke="#e0475b" stroke-width="2.5"><ellipse cx="196" cy="96" rx="34" ry="15"/><ellipse cx="160" cy="174" rx="30" ry="15"/><ellipse cx="246" cy="252" rx="34" ry="15"/></g>
  <path d="M286 252c34-6 52-34 54-70" fill="none" stroke="#e0475b" stroke-width="2" stroke-dasharray="4 5"/>
  <rect x="378" y="40" width="240" height="150" rx="16" fill="#fff8e1" stroke="#f0d78a"/>
  <text x="398" y="70" font-size="13" font-weight="800" fill="#8a6d16" letter-spacing="1.5">LIST OF NAMES</text>
  <g font-size="16" font-weight="700" fill="#18213f"><text x="398" y="102">A  Iran</text><text x="398" y="128">B  Japan</text><text x="398" y="154">C  France</text><text x="398" y="180">D  Italy</text></g>
  <text x="378" y="226" font-size="13.5" font-weight="700" fill="#b3263a">A name can appear more than once:</text>
  <text x="378" y="248" font-size="13.5" font-weight="700" fill="#b3263a">find and circle every one.</text>
</svg>
