<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Manrope, system-ui, sans-serif">
  <title>Plan of a typical house in Zinacantan</title>
  <rect width="800" height="440" fill="#fbfaf6"/>
  <!-- property edge -->
  <rect x="14" y="14" width="772" height="412" rx="18" fill="none" stroke="#c9c2ad" stroke-width="2" stroke-dasharray="7 7"/>
  <!-- main room -->
  <rect x="50" y="60" width="330" height="320" fill="#fff" stroke="#18213f" stroke-width="5"/>
  <text x="215" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#8a93ad">Main room</text>
  <!-- beds along the top wall -->
  <g fill="#eef3fd" stroke="#2b67d1" stroke-width="2.5">
    <rect x="128" y="78" width="46" height="84" rx="6"/><rect x="192" y="78" width="46" height="84" rx="6"/><rect x="256" y="78" width="46" height="84" rx="6"/>
  </g>
  <g fill="#fff" stroke="#2b67d1" stroke-width="2"><rect x="136" y="84" width="30" height="16" rx="5"/><rect x="200" y="84" width="30" height="16" rx="5"/><rect x="264" y="84" width="30" height="16" rx="5"/></g>
  <!-- chairs in the middle -->
  <g fill="#fff" stroke="#18213f" stroke-width="2.5"><rect x="128" y="256" width="30" height="26" rx="4"/><rect x="200" y="256" width="30" height="26" rx="4"/><rect x="272" y="256" width="30" height="26" rx="4"/></g>
  <!-- television on the bottom wall -->
  <rect x="180" y="342" width="70" height="26" rx="4" fill="#18213f"/><rect x="186" y="347" width="58" height="16" rx="2" fill="#5d6b8f"/>
  <!-- door to the kitchen -->
  <rect x="374" y="250" width="12" height="60" fill="#fbfaf6"/>
  <!-- kitchen -->
  <rect x="380" y="200" width="200" height="180" fill="#fff" stroke="#18213f" stroke-width="5"/>
  <text x="452" y="234" text-anchor="middle" font-size="15" font-weight="700" fill="#8a93ad">Kitchen</text>
  <circle cx="480" cy="296" r="24" fill="#ffe6d6" stroke="#d1622c" stroke-width="2.5"/><path d="M480 282c-9 10-9 18 0 26 9-8 9-16 0-26z" fill="#e8823f"/>
  <rect x="410" y="350" width="80" height="18" rx="4" fill="#fff" stroke="#18213f" stroke-width="2"/>
  <circle cx="548" cy="226" r="13" fill="#f5efe0" stroke="#8a7a4f" stroke-width="2.5"/><circle cx="556" cy="256" r="13" fill="#f5efe0" stroke="#8a7a4f" stroke-width="2.5"/>
  <!-- herbs near the kitchen -->
  <g fill="#8fcf9f"><circle cx="410" cy="170" r="7"/><circle cx="430" cy="160" r="7"/><circle cx="450" cy="172" r="7"/><circle cx="470" cy="162" r="7"/><circle cx="490" cy="172" r="7"/></g>
  <text x="450" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7a48">Herbs</text>
  <!-- fruit trees beyond -->
  <g fill="#cfe9d4" stroke="#2f7a48" stroke-width="2"><circle cx="634" cy="120" r="20"/><circle cx="642" cy="200" r="20"/><circle cx="634" cy="280" r="20"/></g>
  <text x="640" y="80" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7a48">Fruit trees</text>
  <!-- sugar cane on the outer edge -->
  <g stroke="#6f8f2a" stroke-width="3" stroke-linecap="round"><path d="M738 60v56M748 66v50M728 68v48"/><path d="M738 156v56M748 162v50M728 164v48"/><path d="M738 252v56M748 258v50M728 260v48"/><path d="M738 348v48M748 352v44M728 354v42"/></g>
</svg>
